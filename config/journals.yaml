journals:
  # Retrieval is not restricted by an allowlist. The current dated publisher
  # index and these independently checked records supply final JIF evidence.
  enabled: true
  mode: easyscholar
  min_jif: 10.0
  require_dated_jif: true # Use the same threshold, but require a dated publisher or authorized record.
  verified_date: "2026-11-01"
  # Fill EASYSCHOLAR_API_KEY in GitHub Actions Secrets. No key is stored here.
  # The live mode requires a key and never falls back to the fixed journal list.
  easyscholar:
    enabled: true
    api_key: ${oc.env:EASYSCHOLAR_API_KEY,}
    timeout: 10
    min_interval: 0.55
  whitelist:
    - name: Nature Aging
      aliases: ["Nat Aging"]
      year: 2025
      jif: 25.0
      source: https://www.nature.com/nataging/journal-impact
      verified_date: "2026-11-01"
    - name: Nature Food
      aliases: ["Nat Food"]
      year: 2025
      jif: 24.7
      source: https://www.nature.com/nature-portfolio/about-journals/journal-metrics
      verified_date: "2026-11-01"
    - name: Nature Genetics
      aliases: ["Nat Genet"]
      year: 2025
      jif: 25.5
      source: https://www.nature.com/nature-portfolio/about-journals/journal-metrics
      verified_date: "2026-11-01"
    - name: Nature Human Behaviour
      aliases: ["Nature Human Behavior", "Nat Hum Behav"]
      year: 2025
      jif: 18.8
      source: https://www.nature.com/nature-portfolio/about-journals/journal-metrics
      verified_date: "2026-11-01"
    - name: Nature Immunology
      aliases: ["Nat Immunol"]
      year: 2025
      jif: 26.5
      source: https://www.nature.com/nature-portfolio/about-journals/journal-metrics
      verified_date: "2026-11-01"
    - name: Nature Metabolism
      aliases: ["Nat Metab"]
      year: 2025
      jif: 27.5
      source: https://www.nature.com/nature-portfolio/about-journals/journal-metrics
