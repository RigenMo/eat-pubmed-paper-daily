name: Keep Alive

on:
  workflow_dispatch:
    inputs:
      recover:
        description: 'Dispatch the daily email if missing'
        type: boolean
        default: false
      sender_run_id:
        description: 'Sender run requesting this automatic check'
        type: string
        default: ''
  schedule:
    - cron: '10 17-23 * * *' # 01:10-07:10 Asia/Shanghai.
    - cron: '10 0-1 * * *' # 08:10-09:10 Asia/Shanghai.
    - cron: '10 2 * * *' # 10:10 Asia/Shanghai deadline check.
    - cron: '37 0-15 * * *' # Hourly, 08:37-23:37 Asia/Shanghai.
  workflow_run:
    workflows: ['Send emails daily']
    types: [completed]

jobs:
  check-daily:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    concurrency:
      group: daily-email-recovery
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Check delivery
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/daily_delivery_guard.py

      - name: Prepare recovery
        id: prepare
        uses: actions/github-script@v8
        env:
          DAY_COMPLETE: ${{ steps.guard.outputs.day_complete }}
          PAPER_COUNT: ${{ steps.guard.outputs.paper_count }}
          DELIVERY_UNKNOWN: ${{ steps.guard.outputs.delivery_unknown }}
          EVENT_NAME: ${{ github.event_name }}
          RECOVER: ${{ inputs.recover }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN_ID: ${{ inputs.sender_run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            if (process.env.SOURCE_RUN_ID) core.info('Automatic sender handoff: ' + process.env.SOURCE_RUN_ID);
            const workflow_id = 'main.yml';
            const localTime = new Date(Date.now() + 8 * 3600000);
            const hour = localTime.getUTCHours();
            const earlyCheckDue = (hour > 1 || (hour === 1 && localTime.getUTCMinutes() >= 10)) && hour < 10;
            const allowed = (process.env.EVENT_NAME === 'schedule' && earlyCheckDue) ||
              (process.env.EVENT_NAME === 'workflow_dispatch' && process.env.RECOVER === 'true') ||
              (process.env.EVENT_NAME === 'workflow_run' && ['failure', 'cancelled'].includes(process.env.RUN_CONCLUSION));
            const workflow = await github.rest.actions.getWorkflow({ owner, repo, workflow_id });
            if (workflow.data.state !== 'active' && !allowed) {
              core.info(`Main workflow is disabled: ${workflow.data.state}; manual check only.`);
            } else if (workflow.data.state !== 'active') {
              core.info(`Enabling main workflow, previous state: ${workflow.data.state}`);
              await github.rest.actions.enableWorkflow({ owner, repo, workflow_id });
              const updated = await github.rest.actions.getWorkflow({ owner, repo, workflow_id });
              if (updated.data.state !== 'active') throw new Error('Main workflow is still disabled');
            }
            core.setOutput('needs_dispatch', 'false');
            if (process.env.DAY_COMPLETE === 'true' || process.env.DELIVERY_UNKNOWN !== 'false') {
              core.info('Daily target met or delivery status unknown.');
              return;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id, per_page: 100
            });
            const supplements = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'supplement.yml', per_page: 100
            });
            if ([...runs, ...supplements].some(run => run.status !== 'completed')) {
              core.info('A main workflow run is still active or queued.');
              return;
            }
            const today = new Date(Date.now() + 8 * 3600000).toISOString().slice(0, 10);
            const priorRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'keep-alive.yml', status: 'completed', per_page: 100,
              created: `>=${new Date(Date.now() - 2 * 86400000).toISOString()}`
            });
            const dispatchTimes = [];
            for (const run of priorRuns) {
              if (run.id === context.runId) continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: run.id, filter: 'all', per_page: 100
              });
              for (const job of jobs) {
                for (const step of job.steps || []) {
                  if (step.name !== 'Dispatch missing daily email' || step.conclusion !== 'success') continue;
                  if (!step.completed_at || Number.isNaN(Date.parse(step.completed_at))) {
                    throw new Error('Successful dispatch has no valid completion time');
                  }
                  const dispatchDay = new Date(Date.parse(step.completed_at) + 8 * 3600000).toISOString().slice(0, 10);
                  if (dispatchDay === today) {
                    dispatchTimes.push(Date.parse(step.completed_at));
                  }
                }
              }
            }
            const maxDispatches = hour >= 9 ? 7 : 6;
            if (dispatchTimes.length >= maxDispatches || (dispatchTimes.length && Date.now() - Math.max(...dispatchTimes) < 30 * 60000)) {
              core.info('Recovery dispatch limit or cooldown reached.');
              return;
            }
            if (hour >= 10) {
              core.info('Morning recovery deadline reached.');
              return;
            }
            if (!allowed) {
              core.info('Read-only check; this event does not request recovery.');
              return;
            }
            const repository = await github.rest.repos.get({ owner, repo });
            core.setOutput('ref', repository.data.default_branch);
            core.setOutput('workflow_id', Number(process.env.PAPER_COUNT) > 0 ? 'supplement.yml' : 'main.yml');
            core.setOutput('needs_dispatch', 'true');

      - name: Dispatch missing daily email
        if: steps.prepare.outputs.needs_dispatch == 'true'
        uses: actions/github-script@v8
        env:
          TARGET_REF: ${{ steps.prepare.outputs.ref }}
          TARGET_WORKFLOW: ${{ steps.prepare.outputs.workflow_id }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: process.env.TARGET_WORKFLOW, ref: process.env.TARGET_REF
            });
            core.info('Requested one recovery run of main.yml.');

  notify-on-failure:
    needs: check-daily
    if: ${{ !cancelled() && needs.check-daily.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    concurrency:
      group: daily-email-notice
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Check delivery and prior notices
        id: guard
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/daily_delivery_guard.py
      - name: Setup uv
        if: steps.guard.outcome != 'success' || steps.guard.outputs.notified == 'false'
        uses: astral-sh/setup-uv@v7
      - name: Send supervisor failure notice
        if: steps.guard.outcome != 'success' || steps.guard.outputs.notified == 'false'
        env:
          PYTHONPATH: src
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          if [ "$GUARD_OUTCOME" != success ]; then echo "Could not verify delivery or prior notices; sending notice without deduplication."; fi
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          uv run --no-project --with hydra-core --with loguru python -c '
          import os
          from datetime import datetime, timedelta, timezone
          from hydra import compose, initialize_config_dir
          from zotero_arxiv_daily.utils import send_email
          with initialize_config_dir(version_base=None, config_dir=os.path.abspath("config")):
              config = compose(config_name="default")
          today = datetime.now(timezone(timedelta(hours=8))).strftime("%Y/%m/%d")
          url = "{}/{}/actions/runs/{}".format(os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"])
          detail = "今日投递状态暂无法核实。" if os.environ["GUARD_OUTCOME"] != "success" else "请查看本次运行。"
          send_email(config, f"<p>文献邮件自动监督出现故障。{detail}</p><p><a href=\"{url}\">查看本次 Actions 运行</a></p>", subject=f"Eat Paper Daily {today}（监督故障）")
          '

  morning-deadline:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    concurrency:
      group: daily-email-morning-notice
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Check deadline
        id: time
        run: echo "due=$(TZ=Asia/Shanghai date +%H | awk '{if ($1 >= 10) print "true"; else print "false"}')" >> "$GITHUB_OUTPUT"
      - name: Check delivery and morning notices
        if: steps.time.outputs.due == 'true'
        id: guard
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOTICE_KIND: morning
        run: python3 scripts/daily_delivery_guard.py
      - name: Setup uv
        if: steps.time.outputs.due == 'true' && ((steps.guard.outcome == 'success' && (steps.guard.outputs.day_complete == 'false' || steps.guard.outputs.delivery_unknown == 'true') && steps.guard.outputs.notified == 'false') || (steps.guard.outcome == 'failure' && github.event_name == 'schedule' && github.event.schedule == '10 2 * * *'))
        uses: astral-sh/setup-uv@v7
      - name: Send morning deadline notice
        if: steps.time.outputs.due == 'true' && ((steps.guard.outcome == 'success' && (steps.guard.outputs.day_complete == 'false' || steps.guard.outputs.delivery_unknown == 'true') && steps.guard.outputs.notified == 'false') || (steps.guard.outcome == 'failure' && github.event_name == 'schedule' && github.event.schedule == '10 2 * * *'))
        env:
          PYTHONPATH: src
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          PAPER_COUNT: ${{ steps.guard.outputs.paper_count }}
          DELIVERY_UNKNOWN: ${{ steps.guard.outputs.delivery_unknown }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          uv run --no-project --with hydra-core --with loguru python -c '
          import os
          from datetime import datetime, timedelta, timezone
          from hydra import compose, initialize_config_dir
          from zotero_arxiv_daily.utils import send_email
          with initialize_config_dir(version_base=None, config_dir=os.path.abspath("config")):
              config = compose(config_name="default")
          now = datetime.now(timezone(timedelta(hours=8))).strftime("%Y/%m/%d %H:%M")
          url = "{}/{}/actions".format(os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"])
          if os.environ["GUARD_OUTCOME"] != "success" or os.environ["DELIVERY_UNKNOWN"] == "true":
              detail = "回执信息暂无法核实，不能确认完整份数"
          else:
              count = int(os.environ["PAPER_COUNT"])
              detail = f"已确认 {count}/10 篇完整精读，尚缺 {max(0, 10-count)} 篇"
          send_email(config, f"<p>截至 {now}（北京时间），{detail}。当前可能正在生成或失败待恢复，请查看 Actions。</p><p><a href=\"{url}\">查看 Actions</a></p>", subject=f"Eat Paper Daily {now}（日报截止状态）")
          '

  keep-alive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update keep-alive file
        run: |
          day=$(date -u +%d)
          hour=$(date -u +%H)
          if { [ "$day" != 01 ] && [ "$day" != 15 ]; } || [ "$hour" != 00 ]; then
            echo "No keep-alive update due today."
            exit 0
          fi
          mkdir -p .github
          echo "Last run: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > .github/keep-alive.txt
          echo "This file is automatically updated to keep the repository active and prevent GitHub Actions from disabling scheduled workflows." >> .github/keep-alive.txt

      - name: Commit and push if changed
        run: |
          day=$(date -u +%d)
          hour=$(date -u +%H)
          if { [ "$day" != 01 ] && [ "$day" != 15 ]; } || [ "$hour" != 00 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keep-alive.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update keep-alive timestamp [skip ci]"
            git push
          fi
