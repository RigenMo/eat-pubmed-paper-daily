name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/complete-reading-system

  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        id: uv
        continue-on-error: true
        uses: astral-sh/setup-uv@v7.1.4

      - name: Install uv if release download failed
        if: steps.uv.outcome == 'failure'
        run: |
          python3 -m pip install --target "$RUNNER_TEMP/uv-bootstrap" uv
          echo "$RUNNER_TEMP/uv-bootstrap/bin" >> "$GITHUB_PATH"

      - name: Run Pytest
        run: |
          uv run pytest -m "" --cov=src/zotero_arxiv_daily --cov-report=term-missing
