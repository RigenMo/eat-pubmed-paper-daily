name: Provider response diagnostic (no email)
on:
  workflow_dispatch:
  push:
    branches: [codex/provider-diagnostic-20261113]
    paths: [.github/workflows/provider-diagnostic.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: reading-inventory-producer
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Leave active senders alone
        id: sender
        uses: actions/github-script@v8
        with:
          script: |
            let busy = false;
            for (const workflow_id of ['main.yml', 'supplement.yml', 'test.yml']) {
              for (const status of ['in_progress', 'queued']) {
                const {data} = await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id, status, per_page: 1});
                if (!Array.isArray(data.workflow_runs)) throw Error('Sender state unavailable');
                if (data.total_count > 0) busy = true;
              }
            }
            core.setOutput('busy', String(busy));
      - name: Check authenticated response without paper content
        if: steps.sender.outputs.busy == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.GOAICHAT_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          base = 'https://llm.goaichat.top/v1'
          models = ['kimi-k3', 'glm-5.3', 'deepseek-v4.1-flash', 'qwen3.8-max']
          results = []
          def check(endpoint, payload=None):
              start = time.monotonic()
              result = {'endpoint': endpoint, 'http_status': None, 'json_response': False}
              try:
                  data = json.dumps(payload).encode() if payload is not None else None
                  request = Request(base + endpoint, data=data, headers={
                      'Authorization': 'Bearer ' + os.environ['OPENAI_API_KEY'],
                      'Content-Type': 'application/json', 'User-Agent': 'eat-paper-diagnostic'})
                  with urlopen(request, timeout=40) as response:
                      result['http_status'] = response.status
                      raw = response.read(1024 * 1024 + 1)
                  if len(raw) > 1024 * 1024:
                      result['error_type'] = 'OversizeResponse'
                  else:
                      value = json.loads(raw)
                      result['json_response'] = True
                      if payload is None:
                          available = {item.get('id') for item in value.get('data', []) if isinstance(item, dict)}
                          result['listed_models'] = {model: model in available for model in models}
                      else:
                          choices = value.get('choices', [])
                          result['nonempty_content'] = bool(choices and choices[0].get('message', {}).get('content'))
                          result['finish_reason'] = choices[0].get('finish_reason') if choices else None
                          result['reasoning_present'] = bool(choices and choices[0].get('message', {}).get('reasoning_content'))
              except HTTPError as error:
                  result['http_status'] = error.code
              except Exception as error:
                  result['error_type'] = type(error).__name__
              result['elapsed_seconds'] = round(time.monotonic() - start, 2)
              return result
          results.append(check('/models'))
          for model in models:
              result = check('/chat/completions', {'model': model, 'messages': [{'role': 'user', 'content': 'Return JSON: {"ok":true}'}], 'max_tokens': 256, 'stream': False, 'response_format': {'type': 'json_object'}})
              result['model'] = model
              result['mode'] = 'json'
              results.append(result)
          if not any(item.get('nonempty_content') for item in results):
              result = check('/chat/completions', {'model': models[2], 'messages': [{'role': 'user', 'content': 'Reply with OK.'}], 'max_tokens': 256, 'stream': False})
              result.update(model=models[2], mode='plain_comparison')
              results.append(result)
          print(json.dumps({'diagnostic_only': True, 'paper_content_sent': False, 'results': results}))
          PY
