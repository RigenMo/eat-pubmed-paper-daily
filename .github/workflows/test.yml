name: Test
on:
  workflow_dispatch:
  push:
    branches:
      - codex/cancel-stalled-test-20261102
permissions:
  contents: read
  actions: write
jobs:
  stop-stalled-run:
    if: github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cancel-stalled-test]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop only the stalled mail test
        uses: actions/github-script@v8
        with:
          script: |
            const args = { owner: context.repo.owner, repo: context.repo.repo, run_id: 41392231175 };
            const response = await github.rest.actions.getWorkflowRun(args);
            if (response.data.status !== 'completed') {
              await github.rest.actions.cancelWorkflowRun(args);
              core.info('Cancellation requested for stalled mail run 41392231175.');
            } else {
              core.info('The old run already completed; no cancellation needed.');
            }
            core.info('This diagnostic workflow does not send any email.');
