name: Test
on:
  push:
    branches:
      - codex/restore-daily-delivery-20261103
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  restore-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explicitly enable and inspect the daily sender
        uses: actions/github-script@v8
        with:
          script: |
            const target = { owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'main.yml' };
            await github.rest.actions.enableWorkflow(target);
            const response = await github.rest.actions.getWorkflow(target);
            if (response.data.state !== 'active') throw new Error('Daily sender is not enabled');
            core.info('DAILY_WORKFLOW_ENABLED: active');
            core.info('This maintenance step does not send email.');
