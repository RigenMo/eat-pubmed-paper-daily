name: Test
on:
  push:
    branches:
      - codex/restore-daily-delivery-20261103
permissions:
  contents: read
  actions: read
jobs:
  verify-delivery-dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Read actual China-date delivery state
        id: delivery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/daily_delivery_guard.py
      - name: Verify today's real submission is recognised
        env:
          DELIVERED: ${{ steps.delivery.outputs.delivered }}
        run: |
          test "$DELIVERED" = "true"
          echo DEDUP_CHECK_PASSED_NO_SECOND_EMAIL
