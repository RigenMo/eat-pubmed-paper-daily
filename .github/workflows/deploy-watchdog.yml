name: Deploy external watchdog
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify required secrets exist
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GH_WATCHDOG_TOKEN: ${{ secrets.GH_WATCHDOG_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ] || [ -z "$GH_WATCHDOG_TOKEN" ]; then
            echo 'Missing CF_API_TOKEN, CF_ACCOUNT_ID, or GH_WATCHDOG_TOKEN; watchdog not deployed.'
            exit 1
          fi
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: scheduler
          command: deploy
      - name: Bind GitHub token
        working-directory: scheduler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GH_WATCHDOG_TOKEN: ${{ secrets.GH_WATCHDOG_TOKEN }}
        run: printf '%s' "$GH_WATCHDOG_TOKEN" | npx --yes wrangler@4 secret put GH_ACTIONS_TOKEN
