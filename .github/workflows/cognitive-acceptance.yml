name: Privacy-safe cognitive digest acceptance
on:
  push:
    branches: [codex/cognitive-acceptance-20261105]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
      ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
      OPENAI_API_KEY: ${{ secrets.GOAICHAT_API_KEY }}
      EASYSCHOLAR_API_KEY: ${{ secrets.EASYSCHOLAR_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Check public classifier and keep private recommendation data inside runner
        run: |
          test -n "$OPENAI_API_KEY"
          uv run python - <<'PY'
          import contextlib
          import io
          import json
          import logging
          import traceback
          import os
          from collections import Counter
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          from hydra import compose,initialize_config_dir
          from loguru import logger
          from openai import OpenAI
          from zotero_arxiv_daily.executor import Executor
          from zotero_arxiv_daily.innovation import assess_innovation
          from zotero_arxiv_daily.retriever.pubmed_retriever import PubMedRetriever,_publication_in_window
          # Existing authorized GitHub processing; never publish Zotero entries,
          # matches, quotes, article lists, reports, or their content-bearing logs.
          # Only fixed-schema aggregate counts/booleans are exported.
          logger.remove()
          logging.disable(logging.CRITICAL)
          out=Path('outputs/privacy-safe-acceptance-summary.json')
          out.parent.mkdir(exist_ok=True)
          with initialize_config_dir(version_base=None,config_dir=os.path.abspath('config')):
              config=compose(config_name='default',overrides=[
                  'llm.api.key=${oc.env:OPENAI_API_KEY}',
                  'llm.api.base_url=https://llm.goaichat.top/v1',
                  'llm.api.timeout=600','llm.api.max_retries=1',
                  'llm.generation_kwargs.model=kimi-k3','llm.generation_kwargs.max_tokens=65536','llm.max_input_tokens=1000000',
                  'zotero.user_id=${oc.env:ZOTERO_ID}','zotero.api_key=${oc.env:ZOTERO_KEY}',
                  'executor.debug=false','executor.send_empty=true','executor.character_pool=[]',
                  'search.mode=5','source.mix_mode=1',
                  'recommendations.enabled=true','recommendations.innovation_enabled=true',
                  'recommendations.max_papers=10','recommendations.max_per_journal=3','recommendations.max_focus_papers=6',
                  'recommendations.publication_days=90','recommendations.candidate_limit=800',
                  'recommendations.verify_limit=120','recommendations.focus_mode=ukb_multimorbidity',
                  'source.pubmed.max_results=800','source.pubmed.public_index_fallback=true','executor.max_paper_num=10',
                  'email.sender=preflight@example.invalid','email.receiver=preflight@example.invalid',
                  'email.smtp_server=localhost','email.smtp_port=1','email.sender_password=unused',
              ])
          client=OpenAI(api_key=config.llm.api.key,base_url=config.llm.api.base_url,timeout=600,max_retries=1)
          summary={'mail_sent':False,'privacy':'aggregate counts only','failure_type':None}
          executor=None
          stage='public_classifier'
          try:
              summary['public_classifier_validation_run']=41972735889
              with contextlib.redirect_stdout(io.StringIO()),contextlib.redirect_stderr(io.StringIO()):
                  stage='initialize_executor'
                  executor=Executor(config)
                  stage='pipeline'
                  for source,retriever_instance in executor.retrievers.items():
                      original=retriever_instance.retrieve_papers
                      def observed(original=original,source=source):
                          try:
                              return original()
                          except Exception as error:
                              summary.setdefault('retriever_errors',{})[source]={'type':type(error).__name__,'http_status':getattr(getattr(error,'response',None),'status_code',None),'frames':[{'file':Path(frame.filename).name,'function':frame.name,'line':frame.lineno} for frame in traceback.extract_tb(error.__traceback__)]}
                              raise
                      retriever_instance.retrieve_papers=observed
                  count=executor.run(send_mail=False)
              papers=executor.last_papers
              today=datetime.now(timezone(timedelta(hours=8))).date()
              journals=Counter(' '.join((paper.journal or '').casefold().split()) for paper in papers)
              focus=sum(any(match.get('basis')=='current_focus' for match in (paper.recommendation_matches or [])) for paper in papers)
              summary.update({
                  'papers':count,'complete_cards':sum(bool(p.reading_card and p.abstract_zh and p.reader_status=='success') for p in papers),
                  'focus_papers':focus,'other_papers':len(papers)-focus,
                  'journal_count':len(journals),'max_per_journal':max(journals.values(),default=0),
                  'innovation_types':dict(Counter((p.innovation_assessment or {}).get('type','unclassified') for p in papers)),
                  'all_if_at_least10':all(float((p.journal_metrics or {}).get('jif',0))>=10 for p in papers),
                  'all_within90_days':all(_publication_in_window(p.publication_date,today-timedelta(days=90),today) for p in papers),
                  'selection_counts':getattr(executor,'selection_audit_summary',{}),
              })
              assert summary['papers']==summary['complete_cards']==10
              assert summary['all_if_at_least10'] and summary['all_within90_days']
              assert summary['max_per_journal']<=3 and focus<=6
              assert any((p.innovation_assessment or {}).get('type')!='uncertain' for p in papers)
          except Exception as error:
              summary['failure_type']=type(error).__name__
              summary['stage']=stage
              summary['error_frames']=[{'file':Path(frame.filename).name,'function':frame.name,'line':frame.lineno} for frame in traceback.extract_tb(error.__traceback__)]
              summary['selection_counts']=getattr(executor,'selection_audit_summary',{})
              summary['retrieval_counts']=getattr(getattr(executor,'retrievers',{}).get('pubmed'),'retrieval_audit',{})
              summary['attempted_card_status_counts']=dict(Counter((getattr(p,'reader_status',None) or 'unknown') for p in getattr(executor,'last_papers',[])))
              out.write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
              print('PRIVATE_PREFLIGHT_AGGREGATE',json.dumps(summary,ensure_ascii=False))
              raise RuntimeError('Privacy-safe preflight failed: '+type(error).__name__) from None
          out.write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PRIVATE_PREFLIGHT_AGGREGATE',json.dumps(summary,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aggregate-acceptance-counts
          path: outputs/privacy-safe-acceptance-summary.json
          retention-days: 7
          if-no-files-found: ignore
