name: Complete missing daily paper cards
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: daily-email-delivery
  cancel-in-progress: false

jobs:
  supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Send missing cards
        id: send
        env:
          PYTHONPATH: src:.
          GITHUB_TOKEN: ${{ github.token }}
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.GOAICHAT_API_KEY }}
          OPENAI_API_BASE: https://llm.goaichat.top/v1
          EASYSCHOLAR_API_KEY: ${{ secrets.EASYSCHOLAR_API_KEY }}
          RECOMMENDATION_FOCUS: ${{ vars.RECOMMENDATION_FOCUS || 'ukb_multimorbidity' }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          test -n "$OPENAI_API_KEY" || { echo "Set the GOAICHAT_API_KEY repository secret first."; exit 1; }
          uv run python scripts/supplement_digest.py executor.send_empty=true executor.debug=false executor.max_paper_num=10 search.mode=5 source.mix_mode=1 llm.api.key='${oc.env:OPENAI_API_KEY}' llm.api.base_url=https://llm.goaichat.top/v1 recommendations.enabled=true recommendations.innovation_enabled=true recommendations.max_papers=10 recommendations.max_per_journal=3 recommendations.publication_days=90 recommendations.candidate_limit=800 recommendations.verify_limit=120 recommendations.focus_mode='${oc.env:RECOMMENDATION_FOCUS}' source.pubmed.max_results=800 llm.api.timeout=600 llm.api.max_retries=1 llm.generation_kwargs.model=kimi-k3 llm.generation_kwargs.max_tokens=65536 llm.max_input_tokens=1000000

      - name: Upload delivery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-delivery-receipt-${{ github.run_attempt }}
          path: outputs/delivery-receipt.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Retry remaining shortfall once
        if: always()
        uses: actions/github-script@v8
        env:
          RETRY_SAFE: ${{ steps.send.outputs.retry_safe }}
          COMPLETE: ${{ steps.send.outputs.complete }}
        with:
          script: |
            if (process.env.RETRY_SAFE !== 'true' || process.env.COMPLETE !== 'false') return;
            const now = new Date();
            const today = new Date(now.getTime() + 8 * 3600000).toISOString().slice(0, 10);
            const hour = Number(new Intl.DateTimeFormat('en-GB', {timeZone: 'Asia/Shanghai', hour: '2-digit', hourCycle: 'h23'}).format(now));
            if (hour >= 12) return;
            const created = '>=' + new Date(now.getTime() - 48 * 3600000).toISOString().slice(0, 10);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'supplement.yml', per_page: 100, created
            });
            const todaysRuns = runs.filter(r => new Date(new Date(r.created_at).getTime() + 8 * 3600000).toISOString().slice(0, 10) === today);
            if (todaysRuns.length >= 2) return;
            const allRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {...context.repo, per_page: 100, created});
            const active = allRuns.some(r => r.id !== context.runId &&
              r.path === '.github/workflows/supplement.yml' &&
              ['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(r.status));
            if (active) return;
            await github.rest.actions.createWorkflowDispatch({...context.repo, workflow_id: 'supplement.yml', ref: 'main'});
