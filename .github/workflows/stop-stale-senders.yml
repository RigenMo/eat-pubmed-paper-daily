name: Stop obsolete queued sender versions
on:
  push:
    branches: [codex/stop-stale-senders-20261107]
permissions:
  actions: write
jobs:
  stop-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const old = new Set(['7a5d6e23fbf854dabe6fffa2ed129b43cd8ee446','287ad6a9ea08567985e73818857f0ed15048e869','e5c5faa1dd16da53a9d0509e803f21541ceb005b']);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns,{...context.repo,workflow_id:'main.yml',branch:'main',per_page:100});
            for (const run of runs.filter(r=>r.status!=='completed' && old.has(r.head_sha))) {
              const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:run.id,per_page:100});
              const sent=jobs.some(j=>j.name==='calculate-and-send' && (j.steps || []).some(s=>s.name==='Run script' && s.conclusion==='success'));
              if(sent){core.info('Old sender step finished: '+run.id+'; verify its receipt, do not cancel.');continue;}
              await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:run.id});
              core.info('Requested cancellation of obsolete sender '+run.id+'; no sender dispatched.');
            }
