name: Send one verified digest test (2026-11-02)
on:
  push:
    branches:
      - codex/send-verified-digest-20261102
permissions:
  contents: read
  actions: read
jobs:
  send-one:
    if: contains(github.event.head_commit.message, '[send-one-verified]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Download the verified reports generated today in Asia/Shanghai
        uses: actions/download-artifact@v4
        with:
          name: automatic-reports
          run-id: 41329949625
          github-token: ${{ github.token }}
          path: outputs/verified-send
      - name: Validate content and send exactly one email
        env:
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          uv run python - <<'PY'
          import json
          import socket
          from pathlib import Path
          from hydra import compose, initialize_config_dir
          from zotero_arxiv_daily.utils import send_email

          folder = Path("outputs/verified-send")
          html = (folder / "index.html").read_text(encoding="utf-8")
          reports = json.loads((folder / "reports.json").read_text(encoding="utf-8"))
          assert len(reports) == 2, "Expected the two verified reports"
          assert all(p["reading_card"] and p["abstract_zh"] and p["card_characters"] <= 800 for p in reports)
          assert all(p["journal_metrics"]["jif"] >= 10 and p["recommendation_matches"] for p in reports)
          assert "生成失败" not in html and len(html) > 5000
          socket.setdefaulttimeout(30)
          with initialize_config_dir(version_base=None, config_dir=str(Path("config").resolve())):
              config = compose(config_name="default")
          send_email(config, html)
          print("SMTP_TEST_RESULT: one email accepted by SMTP; papers=2; complete_cards=2")
          PY
